<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Louis Calendar 2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0d0e11; --panel:#16181d; --panel2:#1c1f25; --line:#2a2d35;
    --text:#f2f2ef; --muted:#9a9ca3; --dim:#6c6f77;
    --imsa:#e8352f; --elms:#f2d30f; --lm:#ff9a1f; --alms:#5fcf6e;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:'Barlow',system-ui,sans-serif;line-height:1.4;-webkit-font-smoothing:antialiased}
  .wrap{max-width:860px;margin:0 auto;padding:40px 20px 64px}

  .hero{position:relative;border-radius:16px;overflow:hidden;min-height:440px;display:flex;align-items:flex-end;margin-bottom:22px;background:#111}
  .hero .photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:62% 40%}
  .hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(13,14,17,.92) 0%,rgba(13,14,17,.55) 45%,rgba(13,14,17,0) 75%),linear-gradient(0deg,rgba(13,14,17,.85) 0%,rgba(13,14,17,0) 45%)}
  .hero-text{position:relative;z-index:1;padding:28px}
  .logo{position:absolute;top:24px;left:28px;z-index:1;width:150px;height:auto;filter:drop-shadow(0 2px 8px rgba(0,0,0,.4))}
  .partners{display:flex;align-items:center;justify-content:center;gap:clamp(24px,6vw,56px);padding:18px 16px;margin-bottom:6px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
  .partners span{font:600 12px 'Barlow Condensed';letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
  .partners img{display:block;width:auto;opacity:.85;transition:opacity .15s}
  .partners a{display:block;padding:6px;border-radius:6px}
  .partners a:hover img{opacity:1}
  .partners a:focus-visible{outline:2px solid var(--lm);outline-offset:2px}
  .partners .p-cad{height:40px} .partners .p-cnx{height:22px} .partners .p-ao{height:34px}
  .socials{display:flex;gap:6px}
  .socials a{display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;color:var(--text);opacity:.85;transition:opacity .15s,background .15s}
  .socials a:hover{opacity:1;background:rgba(255,255,255,.12)}
  .socials a:focus-visible{outline:2px solid var(--lm);outline-offset:2px}
  .socials svg{width:18px;height:18px}
  .hero .socials{margin-top:16px;gap:8px}
  .hero .socials a{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);opacity:1}
  .hero .socials a:hover{background:rgba(255,255,255,.22)}
  footer .socials a{color:var(--muted)}
  .lang{position:absolute;top:20px;right:20px;z-index:2;display:flex;background:rgba(13,14,17,.65);border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:3px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  .lang button{font:700 13px 'Barlow Condensed';letter-spacing:.12em;color:var(--muted);background:none;border:0;border-radius:999px;padding:6px 12px;cursor:pointer}
  .lang button[aria-pressed="true"]{background:var(--text);color:var(--bg)}
  .lang button:focus-visible{outline:2px solid var(--lm);outline-offset:2px}
  .chip-lm{height:14px;width:auto;display:block}
  .chip[aria-pressed="true"] .chip-lm{filter:invert(1)}
  .chip .ic{font-size:16px;line-height:1}
  .lm24{display:inline-flex;align-items:center;justify-content:center;font:800 10px 'Barlow Condensed';letter-spacing:0;background:var(--lm);color:#1a1206;border-radius:4px;height:18px;padding:0 4px}
  header{position:relative;padding-bottom:28px;border-bottom:1px solid var(--line);margin-bottom:28px}
  .stripe{display:flex;gap:6px;margin-bottom:22px}
  .stripe span{height:4px;width:44px;border-radius:2px}
  .eyebrow{font-family:'Barlow Condensed';font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-size:14px}
  h1{font-family:'Barlow Condensed';font-weight:800;font-size:clamp(44px,9vw,76px);line-height:.95;text-transform:uppercase;margin:6px 0 10px;letter-spacing:.01em}
  h1 em{font-style:normal;color:var(--lm)}
  .sub{color:var(--muted);font-size:16px}

  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:24px 0 0}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 14px 12px}
  .stat b{display:block;font-family:'Barlow Condensed';font-size:34px;font-weight:700;line-height:1}
  .stat small{color:var(--muted);font-size:13px}

  .filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:26px}
  .chip{font:600 14px 'Barlow Condensed';letter-spacing:.1em;text-transform:uppercase;color:var(--muted);background:transparent;border:1px solid var(--line);border-radius:999px;padding:8px 16px;cursor:pointer;display:flex;align-items:center;gap:8px;transition:border-color .15s,color .15s,background .15s}
  .chip i{width:8px;height:8px;border-radius:50%;display:inline-block}
  .chip:hover{color:var(--text);border-color:#454852}
  .chip[aria-pressed="true"]{color:var(--bg);background:var(--text);border-color:var(--text)}
  .chip:focus-visible{outline:2px solid var(--lm);outline-offset:2px}

  .month{display:grid;grid-template-columns:92px 1fr;gap:16px;margin-bottom:18px}
  .month h2{font-family:'Barlow Condensed';font-weight:700;font-size:20px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);padding-top:16px;position:sticky;top:0;align-self:start}
  .events{display:flex;flex-direction:column;gap:10px}

  .ev{display:grid;grid-template-columns:86px 1fr auto;align-items:center;gap:16px;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:10px;padding:14px 16px}
  .ev.alms{--c:var(--alms)} .ev.imsa{--c:var(--imsa)} .ev.elms{--c:var(--elms)} .ev.lm{--c:var(--lm)}
  .date{font-family:'Barlow Condensed';text-transform:uppercase;line-height:1}
  .date b{display:block;font-size:26px;font-weight:700;white-space:nowrap}
  .date small{font-size:13px;color:var(--muted);letter-spacing:.08em;font-weight:600}
  .name{font-family:'Barlow Condensed';font-weight:700;font-size:22px;text-transform:uppercase;letter-spacing:.02em;line-height:1.05}
  .where{color:var(--muted);font-size:14.5px;margin-top:3px}
  a.where{display:block;text-decoration:none;color:var(--muted);transition:color .15s}
  a.where:hover{color:var(--text);text-decoration:underline;text-underline-offset:3px}
  a.where:focus-visible{outline:2px solid var(--lm);outline-offset:2px;border-radius:3px}
  .pin{width:12px;height:12px;vertical-align:-1px;margin-right:4px;opacity:.7}
  .country-row{display:flex;align-items:center;gap:14px;margin-top:6px}
  .country-row .country{margin-top:0}
  .tt-btn{display:inline-flex;align-items:center;gap:5px;font:600 13px 'Barlow',sans-serif;color:var(--muted);background:none;border:1px solid var(--line);border-radius:999px;padding:3px 10px;cursor:pointer;transition:color .15s,border-color .15s}
  .tt-btn:hover{color:var(--text);border-color:#4a4d56}
  .tt-btn:focus-visible{outline:2px solid var(--lm);outline-offset:2px}
  .tt-btn svg{width:12px;height:12px}
  .tt-btn.has{color:var(--text);border-color:#4a4d56}
  #tt{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50;overscroll-behavior:contain}
  #tt[hidden]{display:none!important}
  .tt-modal{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:14px;width:100%;max-width:440px;max-height:85vh;max-height:85dvh;display:flex;flex-direction:column;overflow:hidden}
  .tt-hd{flex:none;display:flex;align-items:flex-start;gap:10px;padding:16px 14px 10px 20px;border-bottom:1px solid var(--line)}
  #tt-hdc{flex:1;min-width:0}
  .tt-hd .tt-head{margin-bottom:0}
  .tt-hd .tt-head h3{font-size:24px;margin:0}
  .tt-hd .tt-head small{display:block;margin-top:2px;letter-spacing:.06em}
  .tt-modebar{display:flex;align-items:center;gap:10px;margin-top:10px}
  .tt-modebar .tt-mode{margin:0}
  .tt-mode button{font-size:12px !important;padding:4px 10px !important}
  .tt-off{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
  #tt-close{flex:none}
  #tt-body{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y;padding:12px 20px var(--ft-h,0px);scrollbar-width:thin}
  #tt-body > :last-child{margin-bottom:22px}
  #tt-ft{position:absolute;left:0;right:0;bottom:0;z-index:3;display:none;padding:34px 20px 16px;background:linear-gradient(to bottom,rgba(22,24,29,0) 0,rgba(22,24,29,.92) 30px,var(--panel) 46px);pointer-events:none;border-bottom-left-radius:14px;border-bottom-right-radius:14px}
  #tt-ft > *{pointer-events:auto}
  #tt-ft .pick-bar{margin:0 0 8px}
  #tt-ft .cal-all{box-shadow:0 8px 24px rgba(0,0,0,.45)}
  .tt-modal.selecting #tt-ft{display:block}
  .tt-modal.selecting .tt-note,.tt-modal.selecting .tt-link{display:none}

  .scroll-fade{position:absolute;left:0;right:0;bottom:var(--cue-b,0px);height:56px;background:linear-gradient(to bottom,rgba(22,24,29,0),var(--panel));pointer-events:none;opacity:0;transition:opacity .2s}
  .scroll-cue{position:absolute;left:50%;bottom:calc(var(--cue-b,0px) + 10px);transform:translateX(-50%);display:flex;align-items:center;gap:6px;font:600 12px 'Barlow',sans-serif;color:var(--text);background:rgba(28,31,37,.92);border:1px solid #3a3d45;border-radius:999px;padding:6px 12px 6px 10px;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .2s;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  .scroll-cue svg{width:14px;height:14px;animation:cue-bob 1.6s ease-in-out infinite}
  .scroll-cue:focus-visible{outline:2px solid var(--lm);outline-offset:2px}
  .tt-modal.has-more .scroll-fade{opacity:1}
  .tt-modal.selecting .scroll-fade{display:none}
  .tt-modal.has-more .scroll-cue{opacity:1;pointer-events:auto}
  @keyframes cue-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(3px)}}
  @media (prefers-reduced-motion: reduce){.scroll-cue svg{animation:none}}
  #tt-close{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:18px;cursor:pointer}
  #tt-close:focus-visible{outline:2px solid var(--lm);outline-offset:2px}
  .tt-head{border-left:4px solid var(--c);padding-left:12px;margin-bottom:14px}
  .tt-head.imsa{--c:var(--imsa)} .tt-head.elms{--c:var(--elms)} .tt-head.alms{--c:var(--alms)} .tt-head.lm{--c:var(--lm)}
  .tt-head small{font:600 12px 'Barlow Condensed';letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .tt-head h3{font:700 26px 'Barlow Condensed';text-transform:uppercase;line-height:1.1;margin:2px 0}
  .tt-head span{color:var(--muted);font-size:14px}
  .tt-tz{font-size:13px;color:var(--dim);margin-bottom:10px}
  .tt-day{margin-bottom:14px}
  .tt-day b{display:block;font:700 15px 'Barlow Condensed';letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
  .tt-row{display:grid;grid-template-columns:56px 1fr;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:15px}
  .tt-row span:first-child{font-variant-numeric:tabular-nums;font-weight:600}
  .tt-mode{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:3px;margin-bottom:10px}
  .tt-mode button{font:600 13px 'Barlow',sans-serif;color:var(--muted);background:none;border:0;border-radius:999px;padding:5px 12px;cursor:pointer}
  .tt-mode button[aria-pressed="true"]{background:var(--text);color:var(--bg)}
  .tt-mode button:focus-visible,.cal-add:focus-visible,.cal-all:focus-visible{outline:2px solid var(--lm);outline-offset:2px}
  .tt-row{grid-template-columns:56px 1fr 30px !important;align-items:center}
  .tt-row.pick{cursor:pointer;position:relative}
  .tt-row.pick input{position:absolute;opacity:0;width:1px;height:1px}
  .tt-row .box{width:22px;height:22px;border-radius:6px;border:1.5px solid #555963;display:flex;align-items:center;justify-content:center;transition:background .15s,border-color .15s}
  .tt-row input:checked + .box{background:var(--text);border-color:var(--text)}
  .tt-row input:checked + .box::after{content:"";width:6px;height:11px;border:solid var(--bg);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
  .tt-row input:focus-visible + .box{outline:2px solid var(--lm);outline-offset:2px}
  .pick-bar{display:flex;justify-content:space-between;margin:2px 0 4px}
  .pick-cancel{font:600 13px 'Barlow',sans-serif;color:var(--muted);background:none;border:0;cursor:pointer;padding:4px 0}
  .pick-cancel:hover{color:var(--text)}
  .tt-row .box{display:none}
  .tt-modal.selecting .tt-row .box{display:flex}
  .tt-modal.selecting .tt-row .cal-ico{display:none}
  .tt-row.pick{cursor:default}
  .tt-modal.selecting .tt-row.pick{cursor:pointer}
  .cal-ico{display:flex;align-items:center;justify-content:center;width:30px;height:30px;margin-right:-4px;border-radius:8px;border:1px solid var(--line);background:none;color:var(--muted);cursor:pointer;transition:color .15s,border-color .15s}
  .cal-ico:hover{color:var(--text);border-color:#4a4d56}
  .cal-ico:focus-visible{outline:2px solid var(--lm);outline-offset:2px}
  .cal-ico svg{width:16px;height:16px}
  .pick-toggle{font:600 13px 'Barlow',sans-serif;color:var(--muted);background:none;border:0;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:4px 0}
  .pick-toggle:hover{color:var(--text)}
  .cal-all{width:100%;border:0;cursor:pointer}
  .cal-all:disabled{background:var(--panel2);color:var(--dim);cursor:default}
  .cal-add{display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:8px;border:1px solid var(--line);color:var(--muted);transition:color .15s,border-color .15s}
  .cal-add:hover{color:var(--text);border-color:#4a4d56}
  .cal-add svg{width:16px;height:16px}
  .cal-all{display:flex;align-items:center;justify-content:center;gap:8px;margin:6px 0 8px;padding:11px 14px;border-radius:999px;background:var(--text);color:var(--bg);text-decoration:none;font:700 14px 'Barlow Condensed';letter-spacing:.1em;text-transform:uppercase}
  .cal-all svg{width:16px;height:16px}
  .inline-ic{width:13px;height:13px;vertical-align:-2px}
  .sub-link{width:100%;text-align:left;font:inherit;cursor:pointer;display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text);border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:var(--panel);flex-basis:100%}
  .sub-link:hover{border-color:#4a4d56}
  .sub-link:focus-visible{outline:2px solid var(--lm);outline-offset:2px}
  .sub-link svg{width:20px;height:20px;flex:none}
  .sub-link b{display:block;font:700 15px 'Barlow Condensed';letter-spacing:.08em;text-transform:uppercase}
  .sub-link small{color:var(--muted);font-size:13px}
  .tt-inc{color:var(--elms)}
  .sub-opt{display:flex;align-items:center;justify-content:space-between;gap:12px;text-decoration:none;color:var(--text);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;background:var(--panel2)}
  .sub-opt:hover{border-color:#4a4d56}
  .sub-opt:focus-visible{outline:2px solid var(--lm);outline-offset:2px}
  .sub-opt b{display:block;font:700 17px 'Barlow Condensed';letter-spacing:.06em;text-transform:uppercase}
  .sub-opt small{color:var(--muted);font-size:13px}
  .sub-opt span.arr{color:var(--muted);font-size:18px}
  .tt-note{font-size:12.5px;color:var(--dim);margin-bottom:12px;line-height:1.4}
  .tt-empty{color:var(--muted);padding:12px 0 16px;line-height:1.5}
  .tt-link{display:inline-block;margin-top:6px;color:var(--text);font-size:14px;text-underline-offset:3px}
  .country{display:inline-flex;align-items:center;gap:6px;color:var(--text);font-weight:600;margin-top:6px;font-size:15px}
  .flag{font-size:18px;line-height:1}
  .badge{font:700 12px 'Barlow Condensed';letter-spacing:.14em;text-transform:uppercase;color:var(--c);border:1px solid var(--c);border-radius:4px;padding:4px 8px;white-space:nowrap}
  .series-logo{width:76px;height:24px;object-fit:contain;object-position:right center;opacity:.72}
  .series-logo[alt="Le Mans"]{height:30px}
  .dur{display:inline-flex;align-items:center;gap:4px;font:600 13px 'Barlow',sans-serif;letter-spacing:0;text-transform:none;color:var(--muted);margin-left:10px;vertical-align:3px;white-space:nowrap}
  .dur svg{width:13px;height:13px}
  .cd-btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
  .watch.ghost{background:transparent;color:var(--text);border:1px solid #4a4d56}
  .next{display:inline-block;font:700 11px 'Barlow Condensed';letter-spacing:.14em;text-transform:uppercase;background:var(--text);color:var(--bg);border-radius:3px;padding:2px 6px;margin-left:8px;vertical-align:3px}

  .ev.lm{background:linear-gradient(120deg,#2a1d0c 0%,var(--panel) 60%);border-color:#5a3d14;border-left-color:var(--lm)}
  .ev.lm .name{color:var(--lm)}
  .ev{height:132px}
  .countdown{margin-top:22px;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--c,var(--lm));border-radius:12px;padding:18px 20px;display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap}
  .countdown.imsa{--c:var(--imsa)} .countdown.elms{--c:var(--elms)} .countdown.alms{--c:var(--alms)} .countdown.lm{--c:var(--lm)}
  .cd-label small{display:block;font:600 12px 'Barlow Condensed';letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
  .cd-label b{display:block;font:700 26px 'Barlow Condensed';text-transform:uppercase;line-height:1.1;margin-top:2px}
  .cd-label span{color:var(--muted);font-size:14px}
  .cd-units{display:flex;gap:8px}
  .cd-right{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
  .watch{display:inline-flex;align-items:center;gap:8px;font:700 14px 'Barlow Condensed';letter-spacing:.12em;text-transform:uppercase;text-decoration:none;color:var(--bg);background:var(--c,var(--lm));border-radius:999px;padding:9px 16px;transition:filter .15s}
  .watch{white-space:nowrap}
  .watch:hover{filter:brightness(1.12)}
  .watch:focus-visible{outline:2px solid var(--text);outline-offset:2px}
  .watch svg{width:14px;height:14px}
  .watch-alt{font-size:13px;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
  .watch-alt:hover{color:var(--text)}
  .cd-units div{background:var(--panel2);border:1px solid var(--line);border-radius:8px;min-width:64px;padding:8px 6px;text-align:center}
  .cd-units b{display:block;font:700 30px 'Barlow Condensed';line-height:1;font-variant-numeric:tabular-nums}
  .cd-units small{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
  .note{color:var(--muted);font-size:13.5px;margin-top:6px}

  footer{margin-top:36px;padding-top:20px;border-top:1px solid var(--line);color:var(--dim);font-size:13px;display:flex;flex-wrap:wrap;gap:18px;justify-content:space-between;align-items:center}
  .legend{display:flex;gap:16px;flex-wrap:wrap}
  .legend span{display:flex;align-items:center;gap:6px}
  .legend i{width:10px;height:10px;border-radius:2px;display:inline-block}

  [hidden]{display:none!important}

  @media (max-width:620px){
    .wrap{padding:28px 16px 48px}
    .stats{grid-template-columns:repeat(2,1fr)}
    .hero{min-height:520px;align-items:flex-end}
    .hero .photo{object-position:72% 0%;height:75%}
    .hero::after{background:linear-gradient(180deg,rgba(13,14,17,.75) 0%,rgba(13,14,17,0) 22%),linear-gradient(0deg,rgba(13,14,17,.95) 0%,rgba(13,14,17,.6) 40%,rgba(13,14,17,0) 70%)}
    .hero-text{padding:20px}
    .logo{top:18px;left:20px;width:110px}
    .hero .socials{gap:8px;margin-top:12px}
    .socials a{width:30px;height:30px}
    .socials svg{width:16px;height:16px}
    .partners span{display:none}
    .partners .p-cad{height:30px} .partners .p-cnx{height:16px} .partners .p-ao{height:26px}
    .month{grid-template-columns:1fr;gap:8px}
    .month h2{position:static;padding-top:6px}

// Timetable dialog
let ttLastFocus = null, ttOpenIdx = null;
let ttMode = "mine";
try { if (localStorage.getItem("ttMode2") === "track") ttMode = "track"; } catch(e){}
const CALICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4M12 13v5M9.5 15.5h5"/></g></svg>';
const ICS_BASE = "";
const SUB_URL = "webcal://birel22.github.io/louis-calendar/louis-2027.ics";
const offsetLabel = (date, tz) => { try { return new Intl.DateTimeFormat("en-GB",{timeZone:tz, timeZoneName:"shortOffset"}).formatToParts(date).find(p=>p.type==="timeZoneName").value; } catch(e){ return tz; } };
function fillTT(i){
  const ev = EVENTS[i], t = TIMETABLES[ev.id];
  const link = t ? t.src : OFFICIAL[ev.series];
  let hd = `<div class="tt-head ${ev.series}"><h3 id="tt-title">${esc(L(ev.name))}</h3><small>${LABEL[ev.series]} · ${dateLabel(ev).big} ${dateLabel(ev).small} · ${ev.flag} ${esc(L(ev.country))}</small></div>`;
  let html = "", ft = "";
  if (t){
    const viewerTz = Intl.DateTimeFormat().resolvedOptions().timeZone;
    const zone = ttMode === "track" ? t.tz : viewerTz;
    const first = new Date(t.sessions[0].utc);
    hd += `<div class="tt-modebar"><div class="tt-mode" role="group" aria-label="${T("timeMode")}"><button data-mode="mine" aria-pressed="${ttMode==="mine"}">${T("myTime")}</button><button data-mode="track" aria-pressed="${ttMode==="track"}">${T("trackTime")}</button></div><span class="tt-off" title="${esc(zone.replace(/_/g," "))}">${offsetLabel(first, zone)}</span></div>`;
    const days = [];
    t.sessions.forEach((s, k) => {
      const dt = new Date(s.utc);
      let dl = dt.toLocaleDateString(T("locale"), {timeZone:zone, weekday:"short", day:"numeric", month:"short"}); dl = dl.charAt(0).toUpperCase()+dl.slice(1);
      const tm = dt.toLocaleTimeString(T("locale"), {timeZone:zone, hour:"2-digit", minute:"2-digit", hourCycle:"h23"});
      let g = days[days.length-1]; if (!g || g.label !== dl) { g = {label:dl, rows:[]}; days.push(g); }
      g.rows.push(`<label class="tt-row pick"><span>${tm}</span><span>${esc(L(s.label))}</span><input type="checkbox" class="tt-pick" data-k="${k}" aria-label="${esc(L(s.label))}"><i class="box" aria-hidden="true"></i><button type="button" class="cal-ico" data-k="${k}" aria-label="${T("addOne")} – ${esc(L(s.label))}" title="${T("addOne")}">${CALICON}</button></label>`);
    });
    html += days.map(g => `<div class="tt-day"><b>${esc(g.label)}</b>${g.rows.join("")}</div>`).join("");
    ft = `<div class="pick-area"><div class="pick-bar"><button type="button" class="pick-cancel">${T("cancel")}</button><button type="button" class="pick-toggle">${T("selectAll")}</button></div><button type="button" class="cal-all" disabled>${CALICON}<span class="cal-all-txt">${T("pickNone")}</span></button></div>`;
    html += `<p class="tt-note">${T("calHint")}</p>`;
  } else {
    html += `<p class="tt-empty">${T("notYet")}</p>`;
  }
  html += `<a class="tt-link" href="${link}" target="_blank" rel="noopener">${T("official")}</a>`;
  document.getElementById("tt-hdc").innerHTML = hd;
  document.getElementById("tt-body").innerHTML = html;
  document.getElementById("tt-ft").innerHTML = ft;
}
function icsEsc(t){ return String(t).replace(/\\/g,"\\\\").replace(/,/g,"\\,").replace(/;/g,"\\;").replace(/\n/g,"\\n"); }
function icsDate(dt){ return dt.toISOString().replace(/[-:]/g,"").replace(/\.\d{3}/,""); }
function buildICS(ev, t, ks){
  const now = icsDate(new Date());
  const vev = ks.map(k => { const s = t.sessions[k]; const st = new Date(s.utc), en = new Date(st.getTime()+s.min*60000); const nm = `${t.title} – ${s.label.en}`;
    return ["BEGIN:VEVENT",`UID:${ev.id}-${k}-2027@louisdeletraz-calendar`,`DTSTAMP:${now}`,`DTSTART:${icsDate(st)}`,`DTEND:${icsDate(en)}`,`SUMMARY:${icsEsc(nm)}`,`LOCATION:${icsEsc(t.loc)}`,`DESCRIPTION:${icsEsc("Louis Delétraz · "+t.title+" · "+t.src)}`,"BEGIN:VALARM","ACTION:DISPLAY",`DESCRIPTION:${icsEsc(nm)}`,"TRIGGER:-PT15M","END:VALARM","END:VEVENT"].join("\r\n"); });
  return ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Louis Deletraz//Calendar 2027//EN","CALSCALE:GREGORIAN","METHOD:PUBLISH",...vev,"END:VCALENDAR"].join("\r\n")+"\r\n";
}
function updateCue(){
  const body = document.getElementById("tt-body"), modal = body.parentElement;
  const ft = document.getElementById("tt-ft");
  const sel = modal.classList.contains("selecting");
  const barH = sel ? ft.getBoundingClientRect().height : 0;
  modal.style.setProperty("--cue-b", Math.max(0, barH - 30) + "px");
  modal.style.setProperty("--ft-h", sel ? (barH + 4) + "px" : "0px");
  const more = body.scrollHeight - body.scrollTop - body.clientHeight > 12;
  modal.classList.toggle("has-more", more);
}
document.getElementById("tt-body").addEventListener("scroll", updateCue, {passive:true});
window.addEventListener("resize", () => { if (!document.getElementById("tt").hidden) updateCue(); });
document.getElementById("scroll-cue").addEventListener("click", () => { const b = document.getElementById("tt-body"); b.scrollBy({top: b.clientHeight * 0.7, behavior: "smooth"}); });
function updatePickUI(){
  const box = document.querySelector(".tt-modal");
  const all = [...box.querySelectorAll(".tt-pick")], on = all.filter(c => c.checked).length;
  const btn = box.querySelector(".cal-all"); if (!btn) return;
  btn.disabled = on === 0;
  box.querySelector(".cal-all-txt").textContent = on === 0 ? T("pickNone") : (on === 1 ? T("addOneSel") : T("addN").replace("{n}", on));
  box.querySelector(".pick-toggle").textContent = on === all.length ? T("selectNone") : T("selectAll");
  requestAnimationFrame(updateCue);
}
document.getElementById("tt-body").addEventListener("change", e => { if (e.target.classList.contains("tt-pick")) updatePickUI(); });
document.querySelector(".tt-modal").addEventListener("click", e => {
  const box = document.querySelector(".tt-modal");
  const ico = e.target.closest(".cal-ico");
  if (ico){ e.preventDefault(); box.classList.add("selecting"); const c = box.querySelector(`.tt-pick[data-k="${ico.dataset.k}"]`); if (c) c.checked = true; updatePickUI(); return; }
  if (!box.classList.contains("selecting") && e.target.closest(".tt-row.pick")){ e.preventDefault(); return; }
  if (e.target.closest(".pick-cancel")){ box.classList.remove("selecting"); box.querySelectorAll(".tt-pick").forEach(c => c.checked = false); updatePickUI(); return; }
  if (e.target.closest(".pick-toggle")){ const all=[...box.querySelectorAll(".tt-pick")]; const on=all.every(c=>c.checked); all.forEach(c=>c.checked=!on); updatePickUI(); return; }
  if (e.target.closest(".cal-all")){
    const ev = EVENTS[ttOpenIdx], t = TIMETABLES[ev.id];
    const ks = [...box.querySelectorAll(".tt-pick:checked")].map(c => +c.dataset.k); if (!ks.length) return;
    const mask = ks.reduce((m, k) => m | (1 << k), 0);
    window.location.href = ICS_BASE + `ics/${ev.id}-m${mask}.ics`;
    return;
  }
});
function openTT(i){ ttOpenIdx = i; document.querySelector(".tt-modal").classList.remove("selecting"); fillTT(i); ttLastFocus = document.activeElement; if (document.getElementById("tt").hidden) lockScroll(); document.getElementById("tt").hidden = false; document.getElementById("tt-body").scrollTop = 0; requestAnimationFrame(updateCue); document.getElementById("tt-close").focus(); }
let lockY = 0;
function lockScroll(){ lockY = window.scrollY; const b = document.body.style; b.position = "fixed"; b.top = `-${lockY}px`; b.left = "0"; b.right = "0"; b.width = "100%"; document.documentElement.style.overflow = "hidden"; }
function unlockScroll(){ const b = document.body.style; b.position = b.top = b.left = b.right = b.width = ""; document.documentElement.style.overflow = ""; window.scrollTo(0, lockY); }
function closeTT(){ ttOpenIdx = null; document.getElementById("tt").hidden = true; unlockScroll(); if (ttLastFocus) ttLastFocus.focus(); }
document.getElementById("tt-hdc").addEventListener("click", e => {
  const b = e.target.closest(".tt-mode button"); if (!b) return;
  const keep = [...document.querySelectorAll("#tt-body .tt-pick:checked")].map(c => c.dataset.k);
  ttMode = b.dataset.mode; try { localStorage.setItem("ttMode2", ttMode); } catch(err){}
  fillTT(ttOpenIdx);
  keep.forEach(k => { const c = document.querySelector(`#tt-body .tt-pick[data-k="${k}"]`); if (c) c.checked = true; }); updatePickUI();
});
const SUBS = [["sub_all","sub_all_d","louis-2027.ics"],["sub_qr","sub_qr_d","louis-2027-quali-race.ics"],["sub_r","sub_r_d","louis-2027-races.ics"]];
function fillSub(){
  document.getElementById("tt-hdc").innerHTML = `<div class="tt-head lm"><h3 id="tt-title">${T("subTitle")}</h3></div>`;
  document.getElementById("tt-ft").innerHTML = "";
  document.getElementById("tt-body").innerHTML = `<p class="tt-empty" style="padding-top:0">${T("subIntro")}</p>`

}
document.getElementById("sub-open").addEventListener("click", () => { ttOpenIdx = "sub"; document.querySelector(".tt-modal").classList.remove("selecting"); fillSub(); ttLastFocus = document.activeElement; if (document.getElementById("tt").hidden) lockScroll(); document.getElementById("tt").hidden = false; document.getElementById("tt-body").scrollTop = 0; requestAnimationFrame(updateCue); document.getElementById("tt-close").focus(); });
document.getElementById("tt").addEventListener("click", e => { if (e.target.id === "tt") closeTT(); });
document.getElementById("tt-close").addEventListener("click", closeTT);

// Where to watch
const WATCH = {alms:"https://www.youtube.com/@AsianLeMansSeries", imsa:"https://www.youtube.com/IMSAOfficial", elms:"https://plus.fiawec.com/en", lm:"https://plus.fiawec.com/en"};
const watchBtn = ev => `<div class="cd-btns"><button class="watch ghost cd-tt" data-i="${EVENTS.indexOf(ev)}">${TTICON}${T("schedule")}</button><a class="watch" href="${WATCH[ev.series]}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M7 4.5v15l13-7.5z"/></svg>${T("watch")}</a></div>`;

// Countdown
let cdKey = null;
function tick(){
  const now = new Date(), cd = document.getElementById("cd");
  const cur = EVENTS.find(e => d(e.s) <= now && now < new Date(d(e.e).getTime()+86400000));
  const nxt = EVENTS.find(e => d(e.s) > now);
  if (cur){
    const k = LANG+"cur"+cur.id; if (cdKey === k) return; cdKey = k;
    cd.className = "countdown " + cur.series;
    cd.innerHTML = `<div class="cd-label"><small>${T("now")}</small><b>${esc(L(cur.name))}</b><span>${cur.flag} ${esc(L(cur.country))} · ${LABEL[cur.series]}</span></div><div class="cd-right"><b style="color:var(--c);font:700 26px 'Barlow Condensed';text-transform:uppercase">${T("racing")}</b>${watchBtn(cur)}</div>`;
    return;
  }
  if (!nxt){ const k = LANG+"end"; if (cdKey===k) return; cdKey=k; cd.className="countdown"; cd.innerHTML = `<div class="cd-label"><small>${T("season")}</small><b>${T("over")}</b></div>`; return; }
  let t = Math.max(0, d(nxt.s) - now);
  const D = Math.floor(t/86400000); t%=86400000;
  const H = Math.floor(t/3600000); t%=3600000;
  const M = Math.floor(t/60000), Sx = Math.floor((t%60000)/1000);
  const p = n => String(n).padStart(2,"0");
  const key = LANG+"nxt"+nxt.id;
  if (cdKey === key){
    const set=(u,v)=>{const el=cd.querySelector(`[data-u="${u}"]`); if(el) el.textContent=v;};
    set("d",D); set("h",p(H)); set("m",p(M)); set("s",p(Sx)); return;
  }
  cdKey = key;
  cd.className = "countdown " + nxt.series;
  cd.innerHTML = `<div class="cd-label"><small>${T("nextRace")}</small><b>${esc(L(nxt.name))}</b><span>${nxt.flag} ${esc(L(nxt.country))} · ${LABEL[nxt.series]} · ${dateLabel(nxt).big} ${dateLabel(nxt).small}</span></div>
    <div class="cd-right"><div class="cd-units"><div><b data-u="d">${D}</b><small>${T("days")}</small></div><div><b data-u="h">${p(H)}</b><small>${T("hours")}</small></div><div><b data-u="m">${p(M)}</b><small>${T("min")}</small></div><div><b data-u="s">${p(Sx)}</b><small>${T("sec")}</small></div></div>${watchBtn(nxt)}</div>`;
}

// Apply language
function applyLang(lang){
  LANG = lang;
  document.documentElement.lang = lang;
  document.title = T("docTitle");
  document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = T(el.dataset.i18n));
  document.querySelectorAll("[data-i18n-html]").forEach(el => el.innerHTML = T(el.dataset.i18nHtml));
  document.querySelectorAll("[data-i18n-aria]").forEach(el => { el.setAttribute("aria-label", T(el.dataset.i18nAria)); if (el.hasAttribute("title")) el.title = T(el.dataset.i18nAria); });
  document.querySelectorAll("[data-i18n-alt]").forEach(el => el.alt = T(el.dataset.i18nAlt));
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang===lang ? "true" : "false"));
  render(); cdKey = null; tick();
  if (ttOpenIdx === "sub") fillSub(); else if (ttOpenIdx !== null) fillTT(ttOpenIdx);
  if (ttOpenIdx !== null) requestAnimationFrame(updateCue);
}
document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => {
  try { localStorage.setItem("lang", b.dataset.lang); } catch(e){}
  applyLang(b.dataset.lang);
}));
applyLang(LANG);
setInterval(tick, 1000);
